services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: wingz_assessment_user
      POSTGRES_PASSWORD: wingz_assessment_password
      POSTGRES_DB: wingz_assessment_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5