services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: wingz_assessment_user
      POSTGRES_PASSWORD: wingz_assessment_password
      POSTGRES_DB: wingz_assessment_db
    ports:
      - "5432:5432"